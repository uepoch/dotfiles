add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git "

[git_status]
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 1000
format = "took [$duration]($style) "

[nodejs]
symbol = "node "

[python]
symbol = "py "

[rust]
symbol = "rs "

[golang]
symbol = "go "
